<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1000" cy="150" r="100" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="400" r="150" fill="white" opacity="0.05"/>
  <circle cx="50" cy="500" r="80" fill="white" opacity="0.1"/>
  
  <!-- Main Content -->
  <g transform="translate(100, 200)">
    <!-- Logo/Icon -->
    <rect x="0" y="0" width="120" height="120" rx="24" fill="white" opacity="0.2"/>
    <text x="60" y="85" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">P</text>
    
    <!-- Main Title -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
      Pavel Veselov
    </text>
    
    <!-- Subtitle -->
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="32" fill="url(#textGradient)" opacity="0.95">
      IT &amp; Digital Transformation Leader
    </text>
    
    <!-- Description -->
    <text x="150" y="160" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.9">
      Advisory partner for CEOs/CFOs in trading, finance, and data-heavy businesses
    </text>
    
    <!-- Stats -->
    <g transform="translate(150, 220)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">18+</text>
      <text x="90" y="0" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.8">Years</text>
      
      <text x="220" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">$100M</text>
      <text x="390" y="0" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.8">Portfolio</text>
      
      <text x="560" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">6</text>
      <text x="610" y="0" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.8">Countries</text>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.7" text-anchor="middle">
    pveselov.space
  </text>
</svg>
