<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate OG Image</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    canvas {
      border: 1px solid #ddd;
      display: block;
      margin: 20px auto;
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OG Image Generator (1200x630px)</h1>
    <canvas id="ogCanvas" width="1200" height="630"></canvas>
    <button onclick="downloadImage()">Download og-image.png</button>
  </div>

  <script>
    const canvas = document.getElementById('ogCanvas');
    const ctx = canvas.getContext('2d');

    // Background gradient
    const gradient = ctx.createLinearGradient(0, 0, 1200, 630);
    gradient.addColorStop(0, '#2563eb');
    gradient.addColorStop(1, '#9333ea');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1200, 630);

    // Decorative circles
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.arc(1000, 150, 100, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.beginPath();
    ctx.arc(1100, 400, 150, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.arc(50, 500, 80, 0, Math.PI * 2);
    ctx.fill();

    // Logo background
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.roundRect(100, 200, 120, 120, 24);
    ctx.fill();

    // Logo letter P
    ctx.fillStyle = 'white';
    ctx.font = 'bold 80px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('P', 160, 260);

    // Main title
    ctx.fillStyle = 'white';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('PIXID Studio', 250, 200);

    // Subtitle
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.font = '32px Arial';
    ctx.fillText('Expert AI & Web Development Services', 250, 280);

    // Description
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.font = '24px Arial';
    ctx.fillText('AI Development • Web Development • SaaS Platforms', 250, 340);

    // Stats
    ctx.fillStyle = 'white';
    ctx.font = 'bold 48px Arial';
    ctx.fillText('8', 250, 420);
    ctx.font = '24px Arial';
    ctx.fillText('Projects', 310, 430);

    ctx.font = 'bold 48px Arial';
    ctx.fillText('6', 450, 420);
    ctx.font = '24px Arial';
    ctx.fillText('Live Products', 510, 430);

    ctx.font = 'bold 48px Arial';
    ctx.fillText('150+', 750, 420);
    ctx.font = '24px Arial';
    ctx.fillText('Countries', 850, 430);

    // Bottom text
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('pixidstudio.online', 600, 580);

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'og-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Add roundRect polyfill for older browsers
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        this.beginPath();
        this.moveTo(x + radius, y);
        this.lineTo(x + width - radius, y);
        this.quadraticCurveTo(x + width, y, x + width, y + radius);
        this.lineTo(x + width, y + height - radius);
        this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        this.lineTo(x + radius, y + height);
        this.quadraticCurveTo(x, y + height, x, y + height - radius);
        this.lineTo(x, y + radius);
        this.quadraticCurveTo(x, y, x + radius, y);
        this.closePath();
      };
    }
  </script>
</body>
</html>
