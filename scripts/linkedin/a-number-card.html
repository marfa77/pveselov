<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#0f172a;color:#fff;font-family:-apple-system,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;padding:96px 88px;display:flex;flex-direction:column}
.kicker{font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#f59e0b;font-weight:600}
h1{font-size:76px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-top:28px}
.row{display:flex;gap:28px;margin-top:80px}
.cell{flex:1;border:1px solid #334155;border-radius:24px;padding:36px}
.cell .n{font-size:84px;font-weight:700;letter-spacing:-.02em}
.cell .l{font-size:26px;color:#94a3b8;margin-top:10px;line-height:1.3}
.cell.hot{border-color:#f59e0b}
.cell.hot .n{color:#fbbf24}
.note{font-size:30px;color:#cbd5e1;line-height:1.4;margin-top:56px}
.note b{color:#fff}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:22px;color:#64748b}
</style></head><body>
<div class="kicker">The scale gate</div>
<h1>90% faster.<br>15–17× the cost.</h1>
<div class="row">
  <div class="cell"><div class="n">$0.80</div><div class="l">per document,<br>done manually</div></div>
  <div class="cell hot"><div class="n">$12–14</div><div class="l">per document,<br>with the AI workflow</div></div>
</div>
<p class="note"><b>40% of files</b> still needed a human, who took twice as long as before.</p>
<div class="foot"><span>Source: Richard Ewing, CIO.com, Oct 2026</span><span>Pavel Veselov</span></div>
</body></html>
